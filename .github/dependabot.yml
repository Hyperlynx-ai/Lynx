# Weekly dependency updates, grouped to keep PR noise low.
# Dependabot PRs follow the same rules as any other PR (CI must pass).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Known limitation KL-13 (docs/known-limitations.md):
      # TypeScript 7 breaks typescript-eslint and Vercel's API build;
      # @types/node must match the Node.js runtime (22).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /services/ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
