# Checks every pull request and every push to main.
# PROTECTED AREA: see docs/policies/02-protected-areas.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to find what changed (turbo --affected, migration check)

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.4.0 # this action publishes no floating major tag
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent mirrors are in sync (.agents -> each tool)
        run: node scripts/agents-sync.mjs --check

      - name: Applied migrations are never edited
        if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs origin/${{ github.base_ref }}

      - name: Formatting
        run: pnpm format:check

      - name: Lint, type check, test and build (changed packages only)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run lint typecheck test build --affected
        env:
          # Compare against the PR's base branch (Turborepo looks for a local
          # `main` branch otherwise, which the checkout doesn't create).
          TURBO_SCM_BASE: origin/${{ github.base_ref }}

      - name: Lint, type check, test and build (everything)
        if: github.event_name == 'push'
        run: pnpm turbo run lint typecheck test build

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for secrets
        run: pnpm exec secretlint --maskSecrets "**/*"

      - name: Known vulnerabilities (critical only)
        run: pnpm audit --prod --audit-level=critical
