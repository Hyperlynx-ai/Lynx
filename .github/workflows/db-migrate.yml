# Applies database migrations and auth config to staging, then production,
# whenever supabase/ changes on main (policy DB-06: the only path to remote
# databases). PROTECTED AREA.
#
# Repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_STAGING_DB_PASSWORD,
#   SUPABASE_PROD_DB_PASSWORD, GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
# Repository variables: SUPABASE_STAGING_PROJECT_REF, SUPABASE_PROD_PROJECT_REF
name: Database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1 # staging first; production only if staging succeeded
      fail-fast: true
      matrix:
        include:
          - target: staging
            ref_var: SUPABASE_STAGING_PROJECT_REF
            password_secret: SUPABASE_STAGING_DB_PASSWORD
          - target: production
            ref_var: SUPABASE_PROD_PROJECT_REF
            password_secret: SUPABASE_PROD_DB_PASSWORD
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets[matrix.password_secret] }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      PROJECT_REF: ${{ vars[matrix.ref_var] }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the Supabase CLI (pinned in package.json)
        run: pnpm install --frozen-lockfile

      - name: Link project
        run: pnpm supabase link --project-ref "$PROJECT_REF" --yes

      - name: Apply new migrations
        # --remote: Supabase CLI 3 targets the local database unless told otherwise.
        run: pnpm supabase db push --remote --yes

      - name: Apply auth and API config
        run: pnpm supabase config push --yes
