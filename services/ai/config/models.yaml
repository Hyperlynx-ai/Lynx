# Which model runs each AI task. PROTECTED AREA (policies AI-01, AI-02, PROT-01):
# changing a model or provider decides cost and where candidate data goes.
#
# Model strings are "<provider>:<model>" or "compat:<provider name>/<model>"
# (an OpenAI-compatible endpoint declared under `providers:` below). Examples:
#   google:gemini-3.8-flash        openai:<model>          anthropic:<model>
#   deepseek:deepseek-chat         mistral:<model>         groq:<model>
#   openrouter:<vendor>/<model>    ollama:<model>          zai:<model>
# Any OpenAI-compatible provider (Qwen, Kimi, GLM, MiniMax, Together, a
# self-hosted model, a LiteLLM proxy, ...) is declared under `providers:`.
#
# Each provider reads its own API key variable (GOOGLE_API_KEY, OPENAI_API_KEY, ...).
# Override a task per environment, without editing this file:
#   LYNX_MODEL_<TASK>="primary-model,fallback-1,fallback-2"

tasks:
  # Primary: MiniMax M3.1 Flash on NVIDIA NIM (cv_parse sample: score 1.0 in
  # 9 s). Then GLM 5.3 Flash (NIM), then Gemini. The free Gemini key allows
  # only 20 requests a day per model and is often overloaded (KL-17, KL-20).
  # timeout_s: a model slower than this is abandoned for the next one.
  # "compat:" models get a PDF's text, not the file (scanned PDFs: KL-22).

  # Smoke test of the AI chain (POST /v1/ping).
  ping:
    model: compat:nvidia/minimaxai/minimax-m3.1-flash
    timeout_s: 15
    fallbacks:
      - compat:nvidia/z-ai/glm-5.3-flash
      - google:gemini-3.6-flash
      - google:gemini-3.5-flash-lite

  # CV file -> structured CV (POST /v1/cv/parse).
  cv_parse:
    model: compat:nvidia/minimaxai/minimax-m3.1-flash
    timeout_s: 45
    fallbacks:
      - compat:nvidia/z-ai/glm-5.3-flash
      - google:gemini-3.6-flash
      - google:gemini-3.5-flash-lite

  # One CV section + instruction -> edited section (POST /v1/cv/edit).
  cv_edit:
    model: compat:nvidia/minimaxai/minimax-m3.1-flash
    timeout_s: 30
    fallbacks:
      - compat:nvidia/z-ai/glm-5.3-flash
      - google:gemini-3.6-flash
      - google:gemini-3.5-flash-lite

  # Free text from "Tell Lynx more" -> facts (POST /v1/facts/extract).
  facts_extract:
    model: compat:nvidia/minimaxai/minimax-m3.1-flash
    timeout_s: 25
    fallbacks:
      - compat:nvidia/z-ai/glm-5.3-flash
      - google:gemini-3.6-flash
      - google:gemini-3.5-flash-lite

  # A candidate's top 30 jobs -> fit and a one-line reason (chunk 3.7).
  # Runs in the jobs workflow (GitHub Actions), not behind an endpoint.
  job_rerank:
    model: compat:nvidia/minimaxai/minimax-m3.1-flash
    timeout_s: 120
    fallbacks:
      - compat:nvidia/z-ai/glm-5.3-flash
      - google:gemini-3.6-flash
      - google:gemini-3.5-flash-lite

# OpenAI-compatible endpoints, used as "compat:<name>/<model>".
# Example (uncomment and set the key to use it):
#   qwen:
#     base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
#     api_key_env: QWEN_API_KEY
providers:
  # NVIDIA NIM (build.nvidia.com): OpenAI-compatible; key in NVIDIA_API_KEY.
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

# US dollars per million tokens, for cost estimates in ai_calls. Check the
# provider's current price list when adding a model.
prices: {}
