[project]
name = "lynx-ai"
version = "0.1.0"
description = "Hyperlynx AI service: AI tasks, job ingestion and matching for Lynx."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-ai-slim[google]>=2.71.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
include = ["lynx_ai", "tests", "main.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
